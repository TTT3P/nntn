name: QA — Playwright

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 15
    # pinned: ubuntu-latest became 26.04 (2026-11) and Playwright 1.59.1 can't install
    # chromium deps there → job failed before any test ran. Unpin after bumping Playwright.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Wait for GitHub Pages deploy
        # รอให้ pages build เสร็จก่อน (ถ้า push ล่าสุดใน main)
        run: sleep 60

      - name: Run Playwright tests
        env:
          NNTN_USR: ${{ secrets.NNTN_USR }}
          NNTN_PWD: ${{ secrets.NNTN_PWD }}
          CI: true
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
